name: Weekly PsychoPal
run-name: ${{ github.event_name == 'schedule' && 'Weekly PsychoPal (GitHub timer)' || inputs.only_if_missing && 'Weekly PsychoPal (laptop nudge)' || inputs.end != '' && format('PsychoPal refresh from the app, to {0}', inputs.end) || 'Weekly PsychoPal (manual run)' }}

# What starts a build (each at most once a week, except the button):
#   1. Monday: GitHub's own timer (below). For this repo it fires hours late or not at all, so it is only a free extra.
#   2. Monday 07:30 (or when the laptop is next on): the laptop nudge, psychopal/nudge.py -> push to weekly-nudge -> nudge.yml ->
#      this workflow with only_if_missing=true.
#   3. Any time: the ⟳ button in the app, which sends a period (start / end) and always builds.
# 1 and 2 first check the live site and stop within seconds if an edition already covers last Monday-Sunday.
on:
  schedule:
    - cron: "17 5 * * 1"     # Mondays 05:17 UTC (05:17 GMT / 06:17 BST)
  workflow_dispatch:
    inputs:
      week_end:
        description: "Sunday that ends the week to (re)build, e.g. 2026-11-08 (empty = last full week)"
        required: false
        default: ""
      start:
        description: "Refresh: first day of the period, YYYY-MM-DD (empty = Monday of the end's week). Used by the app's button"
        required: false
        default: ""
      end:
        description: "Refresh: last day of the period, YYYY-MM-DD (e.g. today: this week so far). Used by the app's button"
        required: false
        default: ""
      no_llm:
        description: "Skip Claude this run (only matters if llm.enabled is true in settings.yaml)"
        type: boolean
        default: false
      only_if_missing:
        description: "Only build if last week's edition is not on the site yet (used by the laptop nudge; leave unticked by hand)"
        type: boolean
        default: false

permissions:
  contents: write     # commit state/ and site/data/ back to main
  pages: write
  id-token: write

concurrency:
  group: psychopal
  cancel-in-progress: false

jobs:
  check:   # timer and nudge runs: does an edition already cover last Monday-Sunday? (the app and manual runs always build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          ONLY_IF_MISSING: ${{ inputs.only_if_missing }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ "$EVENT" != "schedule" ] && [ "$ONLY_IF_MISSING" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "Manual run: building."; exit 0; fi
          URL="https://${OWNER,,}.github.io/${REPO}/data/index.json"
          # same rule as psychopal/nudge.py covered(): one edition from last Monday (or earlier) to last Sunday (or later)
          # exit status = python's (the last command of the pipe); site unreachable -> python fails -> build, to be safe
          if MSG=$(curl -fsS --max-time 30 "$URL" | python3 -c '
          import datetime as d, json, sys
          t = d.date.today(); mon = t - d.timedelta(days=t.weekday() + 7); sun = mon + d.timedelta(days=6)
          ok = any(w.get("start", "9999") <= str(mon) and w.get("end", "") >= str(sun) for w in json.load(sys.stdin).get("weeks", []))
          print(f"Last week ({mon} to {sun}) is " + ("already published: nothing to do." if ok else "not on the site yet: building it."))
          sys.exit(0 if ok else 1)'); then RUN=false; else RUN=true; fi
          echo "${MSG:-Could not read the live site: building to be safe.}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Fetch likes / saves synced from your phone (user-state branch)
        run: |
          if git fetch -q origin user-state 2>/dev/null && git show origin/user-state:user-state.json > state/user_state.json 2>/dev/null; then
            echo "user-state loaded"
          else
            rm -f state/user_state.json
            echo "no synced marks yet (phone sync not connected) - fine"
          fi

      - name: Check the Claude API key (non-fatal; tests a key even while Claude is switched off, so it can be verified first)
        id: claude
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python -m psychopal.check_claude --force --save state/claude_check.json | tee claude_check.txt   # the saved file holds only OK/FAIL + reason

      - name: Monthly discovery sweep (first run of each month that sweeps; skipped while Claude or the sweep is off)
        if: ${{ inputs.no_llm != true }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python -m psychopal.monthly_sweep || echo "sweep failed (non-fatal)"

      - name: Build the edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PSYCHOPAL_MAILTO: ${{ vars.PSYCHOPAL_MAILTO }}
          # inputs arrive as environment variables (never pasted into the script) and run_weekly checks they are real dates
          WEEK_END: ${{ inputs.week_end }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          NO_LLM: ${{ inputs.no_llm }}
        run: |
          set --
          if [ -n "$WEEK_END" ]; then set -- "$@" --week-end "$WEEK_END"; fi
          if [ -n "$START" ]; then set -- "$@" --start "$START"; fi
          if [ -n "$END" ]; then set -- "$@" --end "$END"; fi
          if [ "$NO_LLM" = "true" ]; then set -- "$@" --no-llm; fi
          python -m psychopal.run_weekly "$@"

      - name: Run summary (shown on the Actions run page)
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          print("## PsychoPal run")
          if os.path.exists("claude_check.txt"):
              print("**Claude key:** " + open("claude_check.txt", encoding="utf-8").read().strip())
          try:
              s = json.load(open("state/stats.json", encoding="utf-8"))
          except Exception:
              print("\nNo stats.json: the build step failed before writing it."); raise SystemExit
          print(f"\n**Week:** {s.get('week')} ({' to '.join(s.get('window', []))})")
          print("\n**Cards:** " + ", ".join(f"{k} {v}" for k, v in (s.get('cards') or {}).items()))
          llm = s.get("llm", {})
          cl = s.get("claude") or {}
          if cl.get("line"):
              print("\n**Claude:** " + cl["line"])
          elif llm.get("off"):
              print("\n**Card text:** scripted abstract summaries (Claude switched off)")
          if not llm.get("off") and (llm.get("skipped") or llm.get("error") or llm.get("errors") or llm.get("budget_stop")):
              print(f"\n**Claude problems:** {llm.get('budget_stop') or llm.get('skipped') or llm.get('error') or llm.get('errors')}")
          try:
              sw = [json.loads(l) for l in open("state/sweeps.jsonl", encoding="utf-8") if l.strip()][-1]
              if sw.get("date") == s.get("finished", "")[:10]:
                  print(f"\n**Monthly sweep:** {sw.get('error') or str(len(sw.get('added', []))) + ' new watchlist entries'}"
                        f" ({sw.get('usage', {}).get('web_searches', 0)} searches, ${sw.get('cost_usd', 0):.2f})")
          except Exception:
              pass
          p = s.get("preferences") or {}
          print("\n**Preferences:** " + (f"{p.get('liked', 0)} liked / {p.get('disliked', 0)} not for me / {p.get('starred', 0)} saved"
                                        if p.get("synced") else "phone sync not connected (no 👍 / 👎 / ★ received yet)"))
          for al in s.get("alerts", []):
              print(f"\n> **⚠ {al}**")
          for h in s.get("health", []):
              print(f"- {h}")
          EOF

      - name: Commit state and site data
        run: |
          git config user.name "PsychoPal bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state site config
          git reset -q state/user_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Edition $(python -c 'import json;print(json.load(open("state/stats.json"))["week"])')"
          git pull -q --rebase origin main && git push -q origin HEAD:main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
