name: Weekly PsychoPal

on:
  # GitHub runs scheduled workflows "best effort": a trigger can be late or silently dropped (it happened on Mon 16 Nov 2026).
  # So there are backup triggers; each one first checks the live site and stops at once if last week's edition is already there.
  # Odd minutes on purpose: GitHub drops more runs at busy times such as :00 and :30.
  schedule:
    - cron: "17 5 * * 1"     # Mondays 05:17 UTC (05:17 GMT / 06:17 BST): the normal run, ready before ~07:00 UK
    - cron: "47 7 * * 1"     # backup, Monday
    - cron: "23 11 * * 1"    # backup, Monday
    - cron: "41 6 * * 2"     # last backup, Tuesday morning
  workflow_dispatch:
    inputs:
      week_end:
        description: "Sunday that ends the week to (re)build, e.g. 2026-11-08 (empty = last full week)"
        required: false
        default: ""
      no_llm:
        description: "Skip Claude this run (only matters if llm.enabled is true in settings.yaml)"
        type: boolean
        default: false

permissions:
  contents: write     # commit state/ and site/data/ back to main
  pages: write
  id-token: write

concurrency:
  group: psychopal
  cancel-in-progress: false

jobs:
  check:   # scheduled runs: is last week's edition already published? (manual runs always build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "Manual run: building."; exit 0; fi
          WEEK=$(python3 -c "import datetime as d; t=d.date.today(); y,w,_=(t-d.timedelta(days=t.weekday()+7)).isocalendar(); print(f'{y}-W{w:02d}')")
          URL="https://${OWNER,,}.github.io/${REPO}/data/index.json"
          if curl -fsS --max-time 30 "$URL" | python3 -c "import json,sys; sys.exit(0 if any(x.get('week') == '$WEEK' for x in json.load(sys.stdin).get('weeks', [])) else 1)"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Edition $WEEK is already published: nothing to do (backup trigger)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Edition $WEEK is not on the site yet: building it."
          fi

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Fetch likes / saves synced from your phone (user-state branch)
        run: |
          if git fetch origin user-state 2>/dev/null; then
            git show origin/user-state:user-state.json > state/user_state.json && echo "user-state loaded"
          else
            echo "no user-state branch yet (sync not connected) - fine"
          fi

      - name: Check the Claude API key (non-fatal; tests a key even while Claude is switched off, so it can be verified first)
        id: claude
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python -m psychopal.check_claude --force | tee claude_check.txt

      - name: Monthly discovery sweep (first run of each month that sweeps; skipped while Claude or the sweep is off)
        if: ${{ inputs.no_llm != true }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python -m psychopal.monthly_sweep || echo "sweep failed (non-fatal)"

      - name: Build this week's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PSYCHOPAL_MAILTO: ${{ vars.PSYCHOPAL_MAILTO }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.week_end }}" ]; then ARGS="$ARGS --week-end ${{ inputs.week_end }}"; fi
          if [ "${{ inputs.no_llm }}" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          python -m psychopal.run_weekly $ARGS

      - name: Run summary (shown on the Actions run page)
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          print("## PsychoPal run")
          if os.path.exists("claude_check.txt"):
              print("**Claude key:** " + open("claude_check.txt", encoding="utf-8").read().strip())
          try:
              s = json.load(open("state/stats.json", encoding="utf-8"))
          except Exception:
              print("\nNo stats.json: the build step failed before writing it."); raise SystemExit
          print(f"\n**Week:** {s.get('week')} ({' to '.join(s.get('window', []))})")
          print("\n**Cards:** " + ", ".join(f"{k} {v}" for k, v in (s.get('cards') or {}).items()))
          llm = s.get("llm", {})
          cl = s.get("claude") or {}
          if cl.get("line"):
              print("\n**Claude:** " + cl["line"])
          elif llm.get("off"):
              print("\n**Card text:** scripted abstract summaries (Claude switched off)")
          if not llm.get("off") and (llm.get("skipped") or llm.get("error") or llm.get("errors") or llm.get("budget_stop")):
              print(f"\n**Claude problems:** {llm.get('budget_stop') or llm.get('skipped') or llm.get('error') or llm.get('errors')}")
          try:
              sw = [json.loads(l) for l in open("state/sweeps.jsonl", encoding="utf-8") if l.strip()][-1]
              if sw.get("date") == s.get("finished", "")[:10]:
                  print(f"\n**Monthly sweep:** {sw.get('error') or str(len(sw.get('added', []))) + ' new watchlist entries'}"
                        f" ({sw.get('usage', {}).get('web_searches', 0)} searches, ${sw.get('cost_usd', 0):.2f})")
          except Exception:
              pass
          p = s.get("preferences") or {}
          print("\n**Preferences:** " + (f"{p.get('liked', 0)} liked / {p.get('disliked', 0)} not for me / {p.get('starred', 0)} saved"
                                        if p.get("synced") else "phone sync not connected (no 👍 / 👎 / ★ received yet)"))
          for al in s.get("alerts", []):
              print(f"\n> **⚠ {al}**")
          for h in s.get("health", []):
              print(f"- {h}")
          EOF

      - name: Commit state and site data
        run: |
          git config user.name "PsychoPal bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state site config
          git reset -q state/user_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Edition $(python -c 'import json;print(json.load(open("state/stats.json"))["week"])')"
          git pull -q --rebase origin main && git push -q origin HEAD:main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
