# PsychoPal settings. Edit freely; every value has a safe default in code.

site_title: PsychoPal
site_url: "https://alternativestates.github.io/PsychoPal/"   # GitHub Pages address (lower-case user name)
github_repo: "AlternativeStates/PsychoPal"     # used by sync.js for likes/saves across devices

# Papers
papers_total: 25            # papers per weekly edition
top_for_you: 5              # pinned "Top 5 for you" (counts towards the topic quotas below)
# Topics in order of importance (also their order in the feed): [minimum, maximum] papers per week. The minimum is filled only
# with papers above min_paper_score; the rest of papers_total goes to the best-scoring papers within each maximum.
stream_quota:
  psychedelics: [7, 10]       # all aspects of psychedelic research
  neuroimaging: [4, 7]        # technical EEG/MEG, fMRI, PET, MRI methods and brain stimulation
  neuropsychopharm: [3, 6]    # ketamine, stimulants (cocaine, amphetamine), cannabis, serotonin PET, other psychopharmacology
  bio_psychiatry: [3, 5]      # depression, addiction, PTSD: mainly preclinical, plus key human biology
  neurodynamics: [2, 5]       # neural dynamics & computational neuroscience
  brain_body: [2, 4]          # brain–body coupling
min_per_stream: 2           # for any topic not listed in stream_quota
max_per_stream: 8
min_paper_score: 4.0
max_similarity: 0.22        # variety rule: skip a paper this similar (TF-IDF of title or abstract, 0-1) to one already picked
tool_papers_max: 4          # methods/software papers shown as Tools & methods cards

# Wider science: low-priority cards from broad journals and much-discussed papers in any field (never in Top 5)
wider:
  cards: 4                  # 0 = off
  max_seconds: 150          # time budget for the Bluesky attention check
  max_resolve: 12           # discussed papers looked up on OpenAlex per week

# Extras
trials_max: 5               # newly registered psychedelic trials (ClinicalTrials.gov)
catchup_per_week: 2         # older, highly cited must-reads
buzz_top: 30                # how many of the week's papers to check on Bluesky / Hacker News
buzz_discover: 3            # extra "being discussed" papers found on Bluesky (0 = off)

# Opportunities (funding, conferences, training): a card when an entry is new, its page changes, or UKRI posts a matching call
deadlines: false            # true = deadline countdown cards, "Upcoming deadlines" strip and days-left badges (off: deadlines live in your calendar)
countdown_weeks: [8, 4, 2]  # (deadlines: true) reminder card this many weeks before a deadline
deadline_strip_days: 90     # (deadlines: true) "Upcoming deadlines" strip horizon
ukri_max: 6                 # max new UKRI opportunities per week

# Tools
tool_releases_max: 6        # max new software releases per week

# Claude (optional). llm.enabled is the MASTER switch: false = scripted feed and zero API calls (it also switches off rerank, taste
# and sweep below). On, it needs the ANTHROPIC_API_KEY secret on GitHub. Expected cost about $3-4 a year, mostly the monthly sweep.
# Any Claude failure falls back to the scripted behaviour for that run and is retried the next week.
llm:
  enabled: false
  monthly_budget_usd: 1.00  # soft cap: once this month's Claude spend (state/runs.jsonl + state/sweeps.jsonl) reaches it, everything
                            # falls back to scripted text until the 1st. Set the hard cap as a spend limit in the Anthropic Console.
  key_expires: null         # expiry date of the ANTHROPIC_API_KEY, e.g. 2027-11-16: the feed shows a warning 3 weeks before
  # card text: structured Aim / Methods / Results / Conclusion paper summaries + "why it matters for you"; reads changed funding,
  # conference and course pages (status, dates) and filters UKRI calls. Only NEW items are sent; the text is cached forever.
  model: claude-haiku-5-5
  effort: low
  thinking: "off"           # "off" = no extended thinking (cheapest); "adaptive" = let the model think
  use_batch: true           # Message Batches API: 50% cheaper, results within minutes (max wait below)
  batch_max_wait_min: 60
  items_per_request: 10
  max_items_to_llm: 80      # hard cap per week
  text_chars: 2400          # abstract / page text sent per item
rerank:                     # weekly: Claude rates the ~80-paper shortlist against your profile and taste; capped bonus
  enabled: true
  model: claude-haiku-5-5
  effort: low
  thinking: "off"
  shortlist: 80
  max_bonus: 2.5            # points added or taken off (rating 5 = +2.5, 1 = -2.5); the edition cut-off is around 17 points
taste:                      # monthly: Claude reads your 👍 / 👎 / ★ (needs phone sync) and writes a taste profile + boost/lower terms
  enabled: true
  model: claude-haiku-5-5
  effort: medium
  thinking: adaptive
  min_marks: 10             # no digest until this many marked cards
  max_boost: 8
  max_penalise: 6
  term_weight: 0.75         # points per matching term
  max_bonus: 1.5            # cap on the taste-term bonus per paper (with rerank: at most +-4 points in total)
sweep:                      # monthly web search for new funding / conferences / courses (first run of each month)
  enabled: true
  model: claude-sonnet-5-5
  effort: medium
  max_searches: 6
  min_budget_left_usd: 0.40 # skip the sweep if less than this is left of the monthly budget
