name: Weekly PsychoPal

on:
  schedule:
    - cron: "30 5 * * 1"     # Mondays 05:30 UTC (05:30 GMT / 06:30 BST); ready before ~07:00 UK
  workflow_dispatch:
    inputs:
      week_end:
        description: "Sunday that ends the week to (re)build, e.g. 2026-11-08 (empty = last full week)"
        required: false
        default: ""
      no_llm:
        description: "Skip Claude (abstract excerpts only, zero tokens)"
        type: boolean
        default: false

permissions:
  contents: write     # commit state/ and site/data/ back to main
  pages: write
  id-token: write

concurrency:
  group: psychopal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Fetch likes / saves synced from your phone (user-state branch)
        run: |
          if git fetch origin user-state 2>/dev/null; then
            git show origin/user-state:user-state.json > state/user_state.json && echo "user-state loaded"
          else
            echo "no user-state branch yet (sync not connected) - fine"
          fi

      - name: Check the Claude API key (non-fatal; cards fall back to abstract text if it fails)
        id: claude
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python -m psychopal.check_claude | tee claude_check.txt

      - name: Monthly discovery sweep (first Monday of the month only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python -m psychopal.monthly_sweep || echo "sweep failed (non-fatal)"

      - name: Build this week's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PSYCHOPAL_MAILTO: ${{ vars.PSYCHOPAL_MAILTO }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.week_end }}" ]; then ARGS="$ARGS --week-end ${{ inputs.week_end }}"; fi
          if [ "${{ inputs.no_llm }}" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          python -m psychopal.run_weekly $ARGS

      - name: Run summary (shown on the Actions run page)
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          print("## PsychoPal run")
          if os.path.exists("claude_check.txt"):
              print("**Claude key:** " + open("claude_check.txt", encoding="utf-8").read().strip())
          try:
              s = json.load(open("state/stats.json", encoding="utf-8"))
          except Exception:
              print("\nNo stats.json: the build step failed before writing it."); raise SystemExit
          print(f"\n**Week:** {s.get('week')} ({' to '.join(s.get('window', []))})")
          print("\n**Cards:** " + ", ".join(f"{k} {v}" for k, v in (s.get('cards') or {}).items()))
          llm = s.get("llm", {})
          if llm.get("input_tokens") is not None and "skipped" not in llm:
              cost = (llm.get("input_tokens", 0) * 2 + llm.get("output_tokens", 0) * 10) / 1e6 * (0.5 if llm.get("batch") else 1)
              print(f"\n**Claude:** {llm.get('input_tokens', 0):,} input + {llm.get('output_tokens', 0):,} output tokens (about ${cost:.2f})")
          if llm.get("skipped") or llm.get("error") or llm.get("errors"):
              print(f"\n**Claude problems:** {llm.get('skipped') or llm.get('error') or llm.get('errors')}")
          for al in s.get("alerts", []):
              print(f"\n> **⚠ {al}**")
          for h in s.get("health", []):
              print(f"- {h}")
          EOF

      - name: Commit state and site data
        run: |
          git config user.name "PsychoPal bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state site config
          git reset -q state/user_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Edition $(python -c 'import json;print(json.load(open("state/stats.json"))["week"])')"
          git pull -q --rebase origin main && git push -q origin HEAD:main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
