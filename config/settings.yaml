# PsychoPal settings. Edit freely; every value has a safe default in code.

site_title: PsychoPal
site_url: "https://alternativestates.github.io/PsychoPal/"   # GitHub Pages address (lower-case user name)
github_repo: "AlternativeStates/PsychoPal"     # used by sync.js for likes/saves across devices

# Papers
papers_total: 25            # papers per weekly edition
top_for_you: 5              # pinned "Top 5 for you"
min_per_stream: 2           # every stream gets at least this many (if it has candidates above min_paper_score)
max_per_stream: 8
min_paper_score: 4.0
max_similarity: 0.22        # variety rule: skip a paper this similar (TF-IDF of title or abstract, 0-1) to one already picked
tool_papers_max: 4          # methods/software papers shown as Tools & methods cards

# Wider science: low-priority cards from broad journals and much-discussed papers in any field (never in Top 5)
wider:
  cards: 4                  # 0 = off
  max_seconds: 150          # time budget for the Bluesky attention check
  max_resolve: 12           # discussed papers looked up on OpenAlex per week

# Extras
trials_max: 5               # newly registered psychedelic trials (ClinicalTrials.gov)
catchup_per_week: 2         # older, highly cited must-reads
buzz_top: 30                # how many of the week's papers to check on Bluesky / Hacker News
buzz_discover: 3            # extra "being discussed" papers found on Bluesky (0 = off)

# Opportunities (funding, conferences, training): a card when an entry is new, its page changes, or UKRI posts a matching call
deadlines: false            # true = deadline countdown cards, "Upcoming deadlines" strip and days-left badges (off: deadlines live in your calendar)
countdown_weeks: [8, 4, 2]  # (deadlines: true) reminder card this many weeks before a deadline
deadline_strip_days: 90     # (deadlines: true) "Upcoming deadlines" strip horizon
ukri_max: 6                 # max new UKRI opportunities per week

# Tools
tool_releases_max: 6        # max new software releases per week

# Claude. SWITCHED OFF: the app runs without an API key. Paper cards get a scripted Aim / Methods / Results / Conclusion summary
# of the abstract (psychopal/abstracts.py). To switch Claude card text back on: enabled: true + the ANTHROPIC_API_KEY secret on GitHub.
# Only NEW items are then sent; Claude text is cached in state/summaries.jsonl forever.
llm:
  enabled: false
  model: claude-sonnet-5-5
  use_batch: true           # Message Batches API: 50% cheaper, results within minutes (max wait below)
  batch_max_wait_min: 60
  items_per_request: 10
  max_items_to_llm: 80      # hard cap per week
  effort: low
  key_expires: null         # expiry date of the ANTHROPIC_API_KEY, e.g. 2027-11-09: the feed shows a warning 3 weeks before
sweep:
  enabled: false            # monthly Claude web-search sweep for new funding / conferences / courses (needs the API key)
  model: claude-sonnet-5-5
  max_searches: 8
